name: Deploy Core Defense playtest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: core-defense-playtest-pages
  cancel-in-progress: true

env:
  BOOTSTRAP_ARTIFACT_URL: "https://sdmntprwestus3.oaiusercontent.com/files/00000000-2388-81fd-892e-677f42ff4968/raw?se=2026-09-26T10%3A06%3A45Z&sp=r&sv=2026-02-06&sr=b&scid=b362153d-3fb5-40bd-8dca-a52a78dd9c9b&skoid=2d2fbb03-9efb-4ad0-a91c-1db2f5a47997&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T18%3A44%3A48Z&ske=2026-09-26T18%3A44%3A48Z&sks=b&skv=2026-02-06&sig=94E6wnetDeQbLz%2BDNebU2Mr6hW4cNPtClQeuXOWnBEQ%3D"
  VALIDATED_ARTIFACT_SHA256: "22387a602e30d76dc074dc2c882f258004611caa49e7eb9ddc598e03debb34ed"

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out compiled artifact
        uses: actions/checkout@v4

      - name: Reconstruct or cache validated Web export
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$VALIDATED_ARTIFACT_SHA256"
          test -n "$EXPECTED"
          mkdir -p artifact-parts

          VALID_LOCAL=0
          if compgen -G "artifact-parts/core-defense-browser.zip.part-*" > /dev/null; then
            cat artifact-parts/core-defense-browser.zip.part-* > core-defense-browser.zip
            ACTUAL="$(sha256sum core-defense-browser.zip | awk '{print $1}')"
            if [ "$ACTUAL" = "$EXPECTED" ]; then
              VALID_LOCAL=1
            fi
          fi

          if [ "$VALID_LOCAL" -ne 1 ]; then
            echo "Cached artifact is stale; fetching the exact validated candidate."
            curl -L --fail --retry 3 --retry-delay 2 "$BOOTSTRAP_ARTIFACT_URL" -o core-defense-browser.zip
            echo "$EXPECTED  core-defense-browser.zip" | sha256sum -c -

            rm -f artifact-parts/core-defense-browser.zip.part-*
            split -b 700000 -d -a 2 core-defense-browser.zip artifact-parts/core-defense-browser.zip.part-

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add artifact-parts
            if ! git diff --cached --quiet; then
              git commit -m "build: cache adaptive-terrain playtest artifact [skip ci]"
              git push
            fi
          else
            echo "$EXPECTED  core-defense-browser.zip" | sha256sum -c -
          fi

          mkdir -p _site packaged
          unzip -q core-defense-browser.zip -d packaged
          tar -xf packaged/artifact.tar -C _site
          test -f _site/index.html
          test -f _site/index.js
          test -f _site/index.pck
          test -f _site/index.wasm
          test -f _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload compiled site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish playtest
        id: deployment
        uses: actions/deploy-pages@v4
