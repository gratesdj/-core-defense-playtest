name: Deploy Core Defense playtest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: core-defense-playtest-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out compiled artifact
        uses: actions/checkout@v4

      - name: Verify and unpack validated Web export
        shell: bash
        run: |
          echo "e5ed8eed6b7fd980688ce8c395a7faf90c9184a08fd9f5e86640e85371709f14  core-defense-browser.zip" | sha256sum -c -
          mkdir -p _site packaged
          unzip -q core-defense-browser.zip -d packaged
          tar -xf packaged/artifact.tar -C _site
          test -f _site/index.html
          test -f _site/index.js
          test -f _site/index.pck
          test -f _site/index.wasm
          test -f _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload compiled site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish playtest
        id: deployment
        uses: actions/deploy-pages@v4
