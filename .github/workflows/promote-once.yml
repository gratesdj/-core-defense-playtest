name: Promote validated playtest artifact once

on:
  push:
    paths:
      - .github/workflows/promote-once.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download and verify compiled artifact
        env:
          ARTIFACT_URL: "https://sdmntprwestus3.oaiusercontent.com/files/00000000-4280-81fd-a628-c269da8bad8b/raw?se=2026-09-19T21%3A01%3A06Z&sp=r&sv=2026-02-06&sr=b&scid=c4740fe6-5261-40ea-84c4-ded28f6a03a1&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-19T16%3A11%3A33Z&ske=2026-09-20T16%3A11%3A33Z&sks=b&skv=2026-02-06&sig=0BrkUuuOU4S91CLvMYaT7JlCKNGqy2LQ3Nr%2BU0kbmq4%3D"
        run: |
          curl --fail --location --silent --show-error "$ARTIFACT_URL" -o /tmp/core-defense-browser.zip
          echo "5fd5d46b781a0b86cc81e7cd3d3dd15460a33f7fb4bcb8d54d9a4c2d7ea87194  /tmp/core-defense-browser.zip" | sha256sum -c -
          cp /tmp/core-defense-browser.zip core-defense-browser.zip

      - name: Update deployment provenance
        run: |
          sed -i 's/80a38a6424f4f34743a30ea3e53d15f32a3e640acbaea329d07c420c9878a06a/5fd5d46b781a0b86cc81e7cd3d3dd15460a33f7fb4bcb8d54d9a4c2d7ea87194/g' .github/workflows/deploy.yml
          printf '%s\n' \
            'Core Defense browser playtest' \
            'Source build: gratesdj/core-defense-rpg@e194e0a92230cd17465f70afa365ec7951dda807' \
            'Validated workflow: https://github.com/gratesdj/core-defense-rpg/actions/runs/35468795187' \
            'Artifact digest: sha256:5fd5d46b781a0b86cc81e7cd3d3dd15460a33f7fb4bcb8d54d9a4c2d7ea87194' \
            > BUILD_SHA.txt
          sed -i 's/9d48461f6f4e1a7dbb7e35cd08e6c1a6020c6722/e194e0a92230cd17465f70afa365ec7951dda807/g' README.md
          sed -i 's/80a38a6424f4f34743a30ea3e53d15f32a3e640acbaea329d07c420c9878a06a/5fd5d46b781a0b86cc81e7cd3d3dd15460a33f7fb4bcb8d54d9a4c2d7ea87194/g' README.md
          rm .github/workflows/promote-once.yml

      - name: Publish compiled artifact commit
        run: |
          git config user.name "Core Defense QA"
          git config user.email "actions@users.noreply.github.com"
          git add core-defense-browser.zip BUILD_SHA.txt README.md .github/workflows/deploy.yml .github/workflows/promote-once.yml
          git commit -m "Deploy validated territory readability build e194e0a"
          git push
