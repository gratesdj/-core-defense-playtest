name: Promote economy-guarded visible World Gen artifact once

on:
  push:
    paths:
      - .github/workflows/promote-once.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download and verify compiled artifact
        env:
          ARTIFACT_URL: "https://sdmntpreastus2.oaiusercontent.com/files/00000000-6478-81f6-9e51-db8795584a2f/raw?se=2026-09-20T22%3A11%3A17Z&sp=r&sv=2026-02-06&sr=b&scid=5807ec53-ba01-497b-aa7f-e84a4dec9230&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T14%3A25%3A15Z&ske=2026-09-21T14%3A25%3A15Z&sks=b&skv=2026-02-06&sig=vFWwerRnWTrbYBzSTQkF4n1vd2%2BErb64%2B7fV3wthKz0%3D"
        run: |
          curl --fail --location --silent --show-error "$ARTIFACT_URL" -o /tmp/core-defense-browser.zip
          echo "fe6778126ce69fe6d46c621e5989c4cabfd3a33fa2286e91186a71d231d6ae6b  /tmp/core-defense-browser.zip" | sha256sum -c -
          cp /tmp/core-defense-browser.zip core-defense-browser.zip
      - name: Update deployment provenance
        run: |
          printf '%s\n' \
            'Core Defense browser playtest' \
            'Source build: gratesdj/core-defense-rpg@539bd657c7720e3ce393016a8c5540a017940497' \
            'Validated workflow: https://github.com/gratesdj/core-defense-rpg/actions/runs/35540492893' \
            'Artifact digest: sha256:fe6778126ce69fe6d46c621e5989c4cabfd3a33fa2286e91186a71d231d6ae6b' \
            > BUILD_SHA.txt
          sed -i 's/f05350c13d39fbe5f884b926c9d0f7216fdaad68/539bd657c7720e3ce393016a8c5540a017940497/g' README.md
          sed -i 's/0b7dcb2a919a8fdfa052d29e4487f0dda7b9eb0df91049aa07b4c7324ed2d840/fe6778126ce69fe6d46c621e5989c4cabfd3a33fa2286e91186a71d231d6ae6b/g' README.md
      - name: Publish compiled artifact commit
        run: |
          git config user.name "Core Defense QA"
          git config user.email "actions@users.noreply.github.com"
          git add core-defense-browser.zip BUILD_SHA.txt README.md
          git commit -m "Deploy visible World Gen v2 with economy guard 539bd65"
          git push
